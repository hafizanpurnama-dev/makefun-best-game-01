<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON SWARM — Arcade Space Shooter</title>
<style>
  :root { --bg: #04050d; --cyan: #00e5ff; --pink: #ff3d6e; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: radial-gradient(1200px 700px at 50% 42%, #0a0f24 0%, var(--bg) 62%, #020208 100%);
    overflow: hidden;
    font-family: "Courier New", ui-monospace, Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 12px;
  }
  canvas {
    display: block;
    width: min(96vw, calc(96vh * 1.6));
    height: min(96vh, calc(96vw / 1.6));
    image-rendering: auto;
    box-shadow: 0 0 40px rgba(0, 229, 255, 0.16), 0 0 120px rgba(255, 61, 110, 0.10);
    border-radius: 6px;
    cursor: crosshair;
    outline: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="600" tabindex="0"></canvas></div>
<script>
'use strict';
/* ================================================================
   NEON SWARM — a single-file neon space shooter.
   Canvas + vanilla JS only. No libraries, no network, no assets.
   Controls: Arrows / WASD move · Space fire · P pause · M mute · R restart
   Hash scenes for screenshots: #scene=title | #scene=play | #scene=over
   ================================================================ */

/* ---------------- canvas & timing ---------------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const DPR_CAP = 2;
function fit() {
  const wrap = document.getElementById('wrap');
  const vw = wrap.clientWidth, vh = wrap.clientHeight;
  const s = Math.max(0.2, Math.min(vw / W, vh / H));
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit); fit();

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
let last = performance.now();

/* ---------------- audio (generated blips, no assets) ---------------- */
let AC = null, muted = false;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}
function blip(freq, dur, type, vol, slide) {
  if (muted) return;
  const ac = audio(); if (!ac || ac.state !== 'running') return;
  const t = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const SFX = {
  shoot: () => blip(880, 0.07, 'square', 0.045, -500),
  boom:  () => blip(140, 0.28, 'sawtooth', 0.11, -80),
  hit:   () => blip(220, 0.16, 'triangle', 0.12, -140),
  pow:   () => { blip(520, 0.09, 'square', 0.07, 300); blip(780, 0.12, 'square', 0.06, 300); },
  over:  () => { blip(330, 0.5, 'sawtooth', 0.09, -260); blip(160, 0.7, 'sawtooth', 0.08, -100); },
  wave:  () => { blip(300, 0.12, 'square', 0.06, 180); },
  oneup: () => { blip(500, 0.1, 'square', 0.07, 200); blip(700, 0.1, 'square', 0.07, 200); blip(900, 0.14, 'square', 0.07, 200); },
};

/* ---------------- background: starfield + speed lines ---------------- */
const stars = [];
for (let i = 0; i < 110; i++) {
  stars.push({ x: rand(0, W), y: rand(0, H), z: rand(0.3, 1), tw: rand(0, TAU), spd: rand(0.4, 1.2) });
}
function drawBg(dt, speedMul) {
  ctx.fillStyle = '#05060f';
  ctx.fillRect(0, 0, W, H);
  // nebula glows
  const neb = (x, y, r, c) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  };
  neb(W * 0.25, H * 0.3, 260, 'rgba(64,20,90,0.16)');
  neb(W * 0.78, H * 0.55, 300, 'rgba(10,60,110,0.18)');
  // stars
  for (const s of stars) {
    s.y += s.spd * 22 * s.z * dt * speedMul;
    s.tw += dt * 3;
    if (s.y > H) { s.y = -2; s.x = rand(0, W); }
    const tw = 0.45 + 0.45 * Math.sin(s.tw);
    ctx.fillStyle = `rgba(${180 + s.z * 60 | 0},${210 + s.z * 40 | 0},255,${0.25 + 0.55 * tw * s.z})`;
    const sz = s.z > 0.75 ? 2 : 1.4;
    ctx.fillRect(s.x, s.y, sz, sz);
  }
  // speed lines during play
  if (speedMul > 1.7) {
    ctx.strokeStyle = 'rgba(120,200,255,0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 7; i++) {
      const x = ((i * 137 + (performance.now() * 0.9) % 137) % W);
      ctx.beginPath(); ctx.moveTo(x, -10); ctx.lineTo(x + 8, 130); ctx.stroke();
    }
  }
  // subtle scanlines
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
}

/* ---------------- input ---------------- */
const keys = {};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(e.key.toLowerCase()) || e.key === ' ') e.preventDefault();
  keys[k] = true;
  handleKeyPress(k);
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function key(...names) { return names.some(n => keys[n]); }
function handleKeyPress(k) {
  audio();
  if (k === 'm') { muted = !muted; return; }
  if (G.scene === 'title' && (k === ' ' || k === 'enter')) { startGame(); return; }
  if (G.scene === 'over' && (k === 'r' || k === 'enter' || k === ' ')) { startGame(); return; }
  if (G.scene === 'play' && (k === 'p' || k === 'escape')) { G.paused = !G.paused; return; }
}
let mouse = { x: 0, y: 0, down: false };
function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
cv.addEventListener('mousemove', e => { const p = canvasPos(e); mouse.x = p.x; mouse.y = p.y; });
cv.addEventListener('mousedown', e => {
  audio();
  const p = canvasPos(e);
  if (G.scene === 'title' && inRect(p, startBtn)) startGame();
  else if (G.scene === 'over' && inRect(p, restartBtn)) startGame();
  else if (G.scene === 'play') mouse.down = true;
});
cv.addEventListener('mouseup', () => { mouse.down = false; });

/* ---------------- game state ---------------- */
const G = {
  scene: 'title', t: 0, paused: false,
  score: 0, hi: 0, lives: 3, wave: 1, kills: 0, shots: 0, hits: 0,
  combo: 0, comboT: 0, overT: 0,
  shake: 0, waveBanner: 0,
};
try { G.hi = +(localStorage.getItem('neon-swarm-hi') || 0) || 0; } catch (e) {}

const player = {
  x: W / 2, y: H - 90, r: 13, speed: 330,
  fireCD: 0, invuln: 0, rapid: 0, shield: false, tilt: 0, dead: false,
};
let bullets = [], ebullets = [], enemies = [], parts = [], powers = [];

/* ---------------- entity factories ---------------- */
function pSpawn(x, y, vx, vy, life, color, size, glow) {
  parts.push({ x, y, vx, vy, life, max: life, color, size, glow: !!glow });
}
function explode(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(spd * 0.3, spd);
    pSpawn(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.25, 0.7), color, rand(1.5, 3.5), true);
  }
  pSpawn(x, y, 0, 0, 0.35, '#ffffff', 14, true); // shockwave core
  G.shake = Math.min(G.shake + 4, 9);
}
function addRing(x, y, color) {
  parts.push({ x, y, ring: true, r: 6, vr: 220, life: 0.4, max: 0.4, color, size: 2 });
}
function dropPower(x, y) {
  if (Math.random() > 0.085) return;
  const roll = Math.random();
  powers.push({
    x, y, r: 11,
    kind: roll < 0.42 ? 'R' : roll < 0.78 ? 'S' : 'H',
    t: 0,
  });
}
const KINDS = {
  R: { color: '#ffe14d', label: 'R', name: 'RAPID FIRE' },
  S: { color: '#4dffb1', label: 'S', name: 'SHIELD' },
  H: { color: '#ff6ec7', label: '+', name: '+1 SHIP' },
};
function spawnEnemy(kind, x, y, wave) {
  const d = 1 + (wave - 1) * 0.35;
  const base = {
    x, y, t: rand(0, TAU), kind, dead: false,
    fireT: rand(1.2, 2.8),
  };
  if (kind === 'grunt') {
    Object.assign(base, { r: 15, hp: 1, speed: (34 + wave * 4) * d * 0.9, fireRate: rand(2.6, 4) - wave * 0.18, sway: rand(26, 60), swayF: rand(1.2, 2), pts: 100, color: '#ff3d6e' });
  } else if (kind === 'weaver') {
    Object.assign(base, { r: 14, hp: 2, speed: (46 + wave * 5) * d * 0.9, fireRate: rand(3, 4.6) - wave * 0.2, sway: rand(60, 110), swayF: rand(2.2, 3.2), pts: 160, color: '#b26bff' });
  } else { // tank
    Object.assign(base, { r: 24, hp: 4 + Math.floor(wave / 2), speed: (20 + wave * 2.2), fireRate: rand(1.9, 2.6), sway: 0, swayF: 0, pts: 420, color: '#ff8c1a', aimed: true });
  }
  enemies.push(base);
}

/* ---------------- wave spawning ---------------- */
let spawnQueue = [], spawnT = 0, waveState = 'spawning';
function queueWave(w) {
  spawnQueue = [];
  const rows = Math.min(2 + Math.floor((w - 1) / 2), 5);
  const cols = Math.min(5 + w, 9);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      let kind = 'grunt';
      if (w >= 2 && r === rows - 1 && c % 2 === 0) kind = 'weaver';
      if (w >= 3 && r === 0 && c % 3 === 0) kind = 'tank';
      spawnQueue.push({ kind, x: 70 + c * ((W - 140) / Math.max(1, cols - 1)), y: -30 - r * 48, d: c * 0.05 + r * 0.14 });
    }
  }
  spawnT = 0; waveState = 'spawning';
}
function startWave(w) {
  G.wave = w;
  G.waveBanner = 1.8;
  queueWave(w);
  SFX.wave();
}

/* ---------------- run control ---------------- */
function startGame() {
  // A human is driving: disable the screenshot autopilot for this run.
  G.demo = false; demo.on = false;
  G.scene = 'play'; G.t = 0;
  G.score = 0; G.lives = 3; G.kills = 0; G.shots = 0; G.hits = 0;
  G.combo = 0; G.comboT = 0; G.paused = false; G.shake = 0;
  player.x = W / 2; player.y = H - 90; player.invuln = 1.6; player.rapid = 0;
  player.shield = false; player.dead = false; player.fireCD = 0; player.tilt = 0;
  bullets = []; ebullets = []; enemies = []; parts = []; powers = [];
  startWave(1);
}
function gameOver() {
  G.scene = 'over';
  G.overT = 0;
  if (G.score > G.hi) {
    G.hi = G.score;
    try { localStorage.setItem('neon-swarm-hi', String(G.hi)); } catch (e) {}
  }
  SFX.over();
}

/* ---------------- butts & UI ---------------- */
let startBtn = { x: W / 2 - 130, y: 352, w: 260, h: 54 };
let restartBtn = { x: W / 2 - 130, y: 396, w: 260, h: 54 };
function inRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function drawButton(b, label, hover) {
  ctx.save();
  ctx.strokeStyle = hover ? '#ffffff' : '#00e5ff';
  ctx.lineWidth = hover ? 2.4 : 1.6;
  ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = hover ? 22 : 12;
  ctx.fillStyle = hover ? 'rgba(0,229,255,0.14)' : 'rgba(0,229,255,0.06)';
  rr(b.x, b.y, b.w, b.h, 8); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = hover ? '#ffffff' : '#9ff0ff';
  ctx.font = 'bold 22px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  ctx.restore();
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function glowText(text, x, y, size, color, blur) {
  ctx.save();
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = color; ctx.shadowBlur = blur || 18;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.shadowBlur = 0;
  ctx.restore();
}
function hud() {
  ctx.save();
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.font = 'bold 17px "Courier New", monospace';
  glowText('SCORE ' + String(G.score).padStart(7, '0'), 18, 26, '#9ff0ff', 12);
  ctx.textAlign = 'right';
  glowText('HI ' + String(G.hi).padStart(7, '0'), W - 18, 26, '#7f8cff', 10);
  // combo
  if (G.combo > 1) {
    const a = clamp(G.comboT / 2.4, 0, 1);
    ctx.textAlign = 'left';
    ctx.globalAlpha = a;
    glowText('COMBO x' + G.combo, 18, 52, '#ffe14d', 12);
    ctx.globalAlpha = 1;
  }
  // lives as mini ships
  for (let i = 0; i < G.lives; i++) shipShape(36 + i * 24, 56, 7, '#00e5ff');
  ctx.textAlign = 'left';
  if (player.shield) glowText('SHIELD', 18, 84, '#4dffb1', 10);
  if (player.rapid > 0) glowText('RAPID', 18, 106, '#ffe14d', 10);
  // wave indicator
  ctx.textAlign = 'center';
  glowText('WAVE ' + G.wave, W / 2, 26, '#c9c9ff', 12);
  if (G.waveBanner > 0) {
    const a = clamp(G.waveBanner / 0.5, 0, 1);
    ctx.globalAlpha = a;
    glowText('WAVE ' + G.wave + ' INBOUND', W / 2, H * 0.36, '#ff3d6e', 34);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ---------------- gameplay update ---------------- */
function update(dt) {
  G.t += dt;
  // player movement
  let mx = (keys['arrowright'] || keys['d'] ? 1 : 0) - (keys['arrowleft'] || keys['a'] ? 1 : 0);
  let my = (keys['arrowdown'] || keys['s'] ? 1 : 0) - (keys['arrowup'] || keys['w'] ? 1 : 0);
  if (mx === 0 && my === 0 && mouse.down && G.scene === 'play') {
    const dx = mouse.x - player.x, dy = mouse.y - player.y;
    const d = Math.hypot(dx, dy);
    if (d > 4) { mx = dx / d; my = dy / d; }
  }
  player.x += mx * player.speed * dt;
  player.y += my * player.speed * dt;
  player.x = clamp(player.x, 18, W - 18);
  player.y = clamp(player.y, 64, H - 24);
  player.tilt += ((mx * 0.35) - player.tilt) * Math.min(1, dt * 10);
  // thruster trail
  if (Math.random() < 0.55) {
    pSpawn(player.x + rand(-4, 4), player.y + 16, rand(-12, 12), rand(90, 160), rand(0.15, 0.3), '#0099ff', rand(1, 2), true);
  }
  // timers
  if (player.invuln > 0) player.invuln -= dt;
  if (player.rapid > 0) player.rapid -= dt;
  if (G.waveBanner > 0) G.waveBanner -= dt;
  player.fireCD -= dt;
  // firing (space or mouse hold)
  if (G.scene === 'play' && !G.paused && (keys[' '] || mouse.down) && player.fireCD <= 0 && !player.dead) {
    player.fireCD = player.rapid > 0 ? 0.075 : 0.15;
    bullets.push({ x: player.x - 7, y: player.y - 12, vx: 0, vy: -760, r: 3.4, c: '#7df9ff' });
    bullets.push({ x: player.x + 7, y: player.y - 12, vx: 0, vy: -760, r: 3.4, c: '#7df9ff' });
    G.shots += 2;
    SFX.shoot();
    pSpawn(player.x - 7, player.y - 14, 0, -40, 0.1, '#7df9ff', 2, true);
    pSpawn(player.x + 7, player.y - 14, 0, -40, 0.1, '#7df9ff', 2, true);
  }
  // player bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.y += b.vy * dt;
    if (b.y < -20) { bullets.splice(i, 1); continue; }
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (dist2(b.x, b.y, e.x, e.y) < (e.r + b.r) * (e.r + b.r)) {
        bullets.splice(i, 1);
        e.hp -= 1; G.hits++;
        pSpawn(b.x, b.y, 0, 0, 0.12, '#ffffff', 5, true);
        if (e.hp <= 0) killEnemy(j);
        break;
      }
    }
  }
  // enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.t += dt;
    e.x += Math.sin(e.t * e.swayF * TAU * 0.2) * e.sway * dt * 1.4;
    e.y += e.speed * dt;
    if (e.x < 20) e.x = 20; if (e.x > W - 20) e.x = W - 20;
    e.fireT -= dt;
    if (e.fireT <= 0 && e.y > 20 && e.y < H * 0.7 && !player.dead) {
      e.fireT = clamp(e.fireRate, 0.5, 9);
      if (e.aimed) {
        if (G.scene === 'play' || G.demo) {
          const a = Math.atan2(player.y - e.y, player.x - e.x);
          for (let k = -1; k <= 1; k++) {
            ebullets.push({ x: e.x, y: e.y + 10, vx: Math.cos(a + k * 0.16) * 210, vy: Math.sin(a + k * 0.16) * 210, r: 4.5, c: '#ffb340' });
          }
        }
      }
      else if (e.kind === 'weaver') {
        ebullets.push({ x: e.x, y: e.y + 10, vx: rand(-30, 30), vy: 250 + G.wave * 18, r: 4, c: '#d9a6ff' });
      }
      else if (Math.random() < 0.7) {
        ebullets.push({ x: e.x, y: e.y + 10, vx: 0, vy: 190 + G.wave * 20, r: 4, c: '#ff5c8a' });
      }
    }
    if (e.y > H + 40) {
      enemies.splice(i, 1);
      if (G.scene === 'play' || G.demo) { loseShip('slipped through'); }
    }
  }
  // enemy bullets
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > H + 20 || b.y < -20 || b.x < -20 || b.x > W + 20) { ebullets.splice(i, 1); continue; }
    if (player.invuln <= 0 && !player.dead) {
      if (dist2(b.x, b.y, player.x, player.y) < (player.r + b.r) * (player.r + b.r)) {
        ebullets.splice(i, 1);
        hitPlayer(b.x, b.y);
      }
    }
  }
  // enemies vs player body
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (player.invuln <= 0 && !player.dead && (G.scene === 'play' || G.demo) && dist2(e.x, e.y, player.x, player.y) < (e.r + player.r) * (e.r + player.r)) {
      if (G.scene === 'play') { killEnemy(i, true); hitPlayer(e.x, e.y); }
      else { hitPlayer(e.x, e.y); }
    }
  }
  // powers
  for (let i = powers.length - 1; i >= 0; i--) {
    const p = powers[i];
    p.y += 62 * dt; p.t += dt;
    if (p.y > H + 30) { powers.splice(i, 1); continue; }
    if (!player.dead && dist2(p.x, p.y, player.x, player.y) < (p.r + player.r + 4) * (p.r + player.r + 4)) {
      applyPower(p); powers.splice(i, 1);
    }
  }
  // particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    if (p.ring) p.r += p.vr * dt;
    else { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.985; p.vy *= 0.985; }
  }
  // combo timer
  if (G.comboT > 0) { G.comboT -= dt; if (G.comboT <= 0) G.combo = 0; }
  // wave management
  if (G.scene === 'play' || G.demo) {
    if (waveState === 'spawning') {
      spawnT -= dt;
      while (spawnT <= 0 && spawnQueue.length) {
        const s = spawnQueue.shift();
        spawnEnemy(s.kind, s.x, s.y, G.wave);
        spawnT += 0.16;
      }
      if (!spawnQueue.length) waveState = 'clearing';
    } else if (!enemies.length) {
      startWave(G.wave + 1);
    }
  }
  G.shake = Math.max(0, G.shake - dt * 22);
}
function killEnemy(idx, silent) {
  const e = enemies[idx];
  if (!e) return;
  enemies.splice(idx, 1);
  G.kills++;
  // combo
  if (G.scene === 'play') {
    G.combo = G.comboT > 0 ? Math.min(G.combo + 1, 8) : 1;
    G.comboT = 2.4;
    G.score += e.pts * G.combo;
  } else if (G.demo) {
    G.score += e.pts;
    G.combo = G.comboT > 0 ? Math.min(G.combo + 1, 8) : 1;
    G.comboT = 2.4;
  }
  if (!silent) { explode(e.x, e.y, e.color, 16, 190); addRing(e.x, e.y, e.color); SFX.boom(); }
  dropPower(e.x, e.y);
}
function hitPlayer(x, y) {
  if (player.shield) {
    player.shield = false;
    addRing(player.x, player.y, '#4dffb1');
    player.invuln = 1.2;
    SFX.pow();
    explode(x, y, '#4dffb1', 10, 150);
    return;
  }
  loseShip('destroyed');
  explode(x, y, '#00e5ff', 26, 260);
  SFX.hit();
}
function loseShip(reason) {
  if (player.dead) return;
  G.lives--;
  if (G.lives <= 0) {
    player.dead = true;
    explode(player.x, player.y, '#fff', 46, 320);
    setTimeout(gameOver, 300);
    return;
  }
  player.invuln = 2.2;
}
function applyPower(p) {
  const k = KINDS[p.kind];
  if (p.kind === 'R') { player.rapid = 8; }
  else if (p.kind === 'S') { player.shield = true; }
  else if (p.kind === 'H') {
    if (G.lives < 5) { G.lives++; SFX.oneup(); }
    else { G.score += 500; }
  }
  if (p.kind !== 'H' || G.lives < 5) SFX.pow();
  addRing(player.x, player.y, k.color);
  pSpawn(p.x, p.y, 0, 0, 0.3, k.color, 12, true);
}

/* ---------------- demo autopilot (for #scene=over screenshots) ---------------- */
const demo = { on: false, aiX: W / 2, think: 0, plan: 0, started: 0, killAt: 999 };
function demoThink(dt) {
  demo.think -= dt;
  demo.aiX += demo.plan * player.speed * dt;
  demo.aiX = clamp(demo.aiX, 24, W - 24);
  // steer toward nearest open column under incoming fire
  if (demo.think <= 0) {
    demo.think = 0.22;
    let danger = null, bd = 1e9;
    for (const b of ebullets) {
      if (b.vy > 0 && b.y < player.y) {
        const d = Math.abs(b.x - demo.aiX) + Math.abs(b.y - player.y) * 0.15;
        if (d < bd) { bd = d; danger = b; }
      }
    }
    if (danger) {
      const side = danger.vx > 0 ? 1 : -1;
      demo.plan = (danger.x > demo.aiX ? -1 : 1) * 1 + (danger.x > demo.aiX ? -0.35 : 0.35);
      demo.plan = rand(-0.9, 0.9) + (side * 0.4);
    } else {
      // pursue lowest enemy
      let low = null;
      for (const e of enemies) if (!low || e.y > low.y) low = e;
      demo.plan = low ? clamp((low.x - demo.aiX) / 220, -1, 1) : 0;
    }
  }
  player.x = demo.aiX;
  player.y = H - 90;
  if (player.fireCD <= 0 && !player.dead) {
    player.fireCD = 0.13;
    bullets.push({ x: player.x - 7, y: player.y - 12, vx: 0, vy: -760, r: 3.4, c: '#7df9ff' });
    bullets.push({ x: player.x + 7, y: player.y - 12, vx: 0, vy: -760, r: 3.4, c: '#7df9ff' });
  }
  if (performance.now() - demo.started > 26000) { player.dead = true; setTimeout(gameOver, 300); }
}
function startDemo() {
  startGame();               // resets everything, clears demo flags
  G.demo = true;             // then re-enable the autopilot on the fresh run
  demo.on = true; demo.think = 0; demo.plan = 0; demo.started = performance.now();
  G.scene = 'play';
}

/* ---------------- scenes ---------------- */
function drawTitle() {
  drawBg(0.016, 1.5);
  // title
  glowText('NEON', W / 2, 118, 92, '#00e5ff', 34);
  glowText('SWARM', W / 2, 206, 92, '#ff3d6e', 34);
  ctx.font = '17px "Courier New", monospace';
  ctx.fillStyle = '#8fa3c8'; ctx.textAlign = 'center';
  ctx.fillText('— vector arcade · defend the last relay —', W / 2, 258);
  // keys guide
  ctx.font = 'bold 16px "Courier New", monospace';
  const lines = [
    ['ARROWS / WASD', 'move the ship'],
    ['SPACE  (hold)', 'twin plasma cannons'],
    ['P', 'pause · M mute · R restart'],
    ['CATCH', 'R rapid fire · S shield · + extra ship'],
  ];
  lines.forEach((l, i) => {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#00e5ff';
    ctx.fillText(l[0], W / 2 - 26, 296 + i * 28);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#6f86ad';
    ctx.fillText(l[1], W / 2 + 26, 296 + i * 28);
  });
  const hover = inRect(mouse, startBtn);
  drawButton(startBtn, '▶  START MISSION', hover);
  ctx.fillStyle = '#5a6f95';
  ctx.font = '14px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('HI-SCORE ' + String(G.hi).padStart(7, '0') + '   ·   press SPACE', W / 2, 462);
  ctx.fillStyle = '#445577';
  ctx.fillText('wave control: the swarm grows faster every rally', W / 2, 556);
  // decorative enemy parade
  const decos = [
    { x: W / 2 - 160, y: 520, c: '#ff3d6e', r: 15 },
    { x: W / 2, y: 515, c: '#b26bff', r: 14 },
    { x: W / 2 + 160, y: 520, c: '#ff8c1a', r: 22 },
  ];
  for (const d of decos) enemyShape(d.x, d.y, d.r, d.c, 0.9);
}
function enemyShape(x, y, r, color, a) {
  ctx.save();
  ctx.globalAlpha = a === undefined ? 1 : a;
  ctx.fillStyle = color;
  ctx.shadowColor = color; ctx.shadowBlur = 14;
  ctx.translate(x, y);
  if (color === '#ff3d6e') {
    ctx.rotate(Math.PI / 4);
    ctx.fillRect(-r * 0.62, -r * 0.62, r * 1.24, r * 1.24);
  } else if (color === '#b26bff') {
    ctx.beginPath();
    ctx.moveTo(0, -r); ctx.lineTo(r * 0.9, r * 0.7); ctx.lineTo(-r * 0.9, r * 0.7);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const ang = i / 6 * TAU;
      const px = Math.cos(ang) * r, py = Math.sin(ang) * r;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(-r * 0.35, -3, r * 0.7, 6);
  }
  ctx.restore();
}
function shipShape(x, y, r, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.shadowColor = color; ctx.shadowBlur = 16;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.lineTo(r * 0.86, r * 0.55);
  ctx.lineTo(r * 0.34, r * 0.2);
  ctx.lineTo(0, r * 0.62);
  ctx.lineTo(-r * 0.34, r * 0.2);
  ctx.lineTo(-r * 0.86, r * 0.55);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#eaffff';
  ctx.beginPath(); ctx.arc(0, -r * 0.15, r * 0.22, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawPlay(dt) {
  drawBg(dt, 1.4 + G.wave * 0.35);
  // demo hook
  if (G.demo) demoThink(dt);
  // bullets
  for (const b of bullets) { dot(b.x, b.y, b.r, b.c, 12); bulletTail(b); }
  for (const b of ebullets) { dot(b.x, b.y, b.r, b.c, 10); }
  // powers
  for (const p of powers) {
    const k = KINDS[p.kind];
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.sin(p.t * 4) * 0.3);
    ctx.strokeStyle = k.color; ctx.lineWidth = 2;
    ctx.shadowColor = k.color; ctx.shadowBlur = 12;
    rr(-10, -10, 20, 20, 4); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = k.color;
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(k.label, 0, 1);
    ctx.restore();
  }
  // enemies
  for (const e of enemies) {
    enemyShape(e.x, e.y, e.r, e.color, 1);
    if (e.hp > 1) {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r * 2 * clamp(e.hp / (e.kind === 'tank' ? 6 : 2), 0, 1), 3);
    }
  }
  // particles
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.ring) {
      ctx.strokeStyle = p.color; ctx.globalAlpha = a;
      ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      dot(p.x, p.y, p.size, p.color, p.glow ? 8 : 0, a);
    }
  }
  // player
  if (!player.dead && (player.invuln <= 0 || Math.floor(G.t * 12) % 2 === 0)) {
    shipShape(player.x, player.y, 15, '#00e5ff');
    if (player.shield) {
      ctx.strokeStyle = '#4dffb1'; ctx.lineWidth = 2;
      ctx.shadowColor = '#4dffb1'; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(player.x, player.y, 24 + Math.sin(G.t * 6) * 2, 0, TAU); ctx.stroke();
    }
  }
  hud();
  if (G.paused) {
    ctx.fillStyle = 'rgba(2,3,10,0.72)'; ctx.fillRect(0, 0, W, H);
    glowText('PAUSED', W / 2, H / 2 - 12, 44, '#00e5ff', 22);
    glowText('press P to resume', W / 2, H / 2 + 34, 18, '#9ff0ff', 10);
  }
}
function dot(x, y, r, color, blur, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = color;
  if (blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.restore();
}
function bulletTail(b) {
  ctx.save();
  const g = ctx.createLinearGradient(b.x, b.y + 4, b.x, b.y - 16);
  g.addColorStop(0, 'rgba(125,249,255,0)');
  g.addColorStop(1, 'rgba(125,249,255,0.5)');
  ctx.fillStyle = g;
  ctx.fillRect(b.x - 1.6, b.y - 16, 3.2, 20);
  ctx.restore();
}
function drawOver() {
  drawBg(0.016, 1);
  // frozen battlefield backdrop
  for (const b of ebullets) dot(b.x, b.y, b.r, b.c, 4, 0.5);
  for (const e of enemies) enemyShape(e.x, e.y, e.r, e.color, 0.4);
  for (const p of parts) { const a = clamp(p.life / p.max, 0, 1) * 0.5; if (!p.ring) dot(p.x, p.y, p.size, p.color, 0, a); }
  ctx.fillStyle = 'rgba(2,3,10,0.66)'; ctx.fillRect(0, 0, W, H);
  glowText('GAME OVER', W / 2, 130, 64, '#ff3d6e', 30);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#b8c7e8';
  ctx.font = '15px "Courier New", monospace';
  ctx.fillText('the swarm broke through the last relay', W / 2, 178);
  // stats grid
  const stats = [
    ['FINAL SCORE', String(G.score)],
    ['BEST', String(G.hi)],
    ['WAVE REACHED', String(G.wave)],
    ['KILLS', String(G.kills)],
    ['ACCURACY', G.shots ? Math.round(G.hits / G.shots * 100) + '%' : '—'],
  ];
  const sx = W / 2 - 170;
  stats.forEach((s, i) => {
    const x = sx + (i % 2) * 200, y = 224 + Math.floor(i / 2) * 58;
    rr(x, y, 190, 48, 6);
    ctx.fillStyle = 'rgba(10,16,34,0.8)';
    ctx.fill(); ctx.strokeStyle = 'rgba(0,229,255,0.35)'; ctx.stroke();
    ctx.fillStyle = '#6f86ad'; ctx.font = '12px "Courier New", monospace';
    ctx.fillText(s[0], x + 95, y + 15);
    ctx.fillStyle = '#eaffff'; ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillText(s[1], x + 95, y + 34);
  });
  const hover = inRect(mouse, restartBtn);
  drawButton(restartBtn, '↻  RESTART', hover);
  ctx.fillStyle = '#7f95bd';
  ctx.font = '14px "Courier New", monospace';
  ctx.fillText('press R to re-enter the swarm', W / 2, 476);
  if (G.kills === 0 && G.score === 0) {
    ctx.fillStyle = '#ff6ec7';
    ctx.fillText('tip: hold SPACE and stay under the tanks', W / 2, 520);
  }
}

/* ---------------- hash scene override (#scene=title|play|over) ---------------- */
function sceneFromHash() {
  const m = /(?:^|[#&])scene=(title|play|over)/.exec(location.hash);
  return m ? m[1] : null;
}
function applyHash() {
  const s = sceneFromHash();
  if (!s) return false;
  if (s === 'title') { G.demo = false; demo.on = false; G.scene = 'title'; }
  else if (s === 'play') { G.demo = false; demo.on = false; startGame(); }
  else if (s === 'over') {
    if (G.scene === 'over') return true;
    if (!G.demo) startDemo();
  }
  return true;
}
window.addEventListener('hashchange', () => { applyHash(); });
if (applyHash()) {
  // hash overrides the natural boot state
} else {
  G.scene = 'title';
}

/* ---------------- main loop ---------------- */
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (G.scene === 'play' && !G.paused && !player.dead) update(dt);
  else if (G.scene === 'play' && player.dead) update(dt * 0.4); // slow-mo on death
  else if (G.demo && G.scene === 'play' && !player.dead) update(dt);
  else G.t += dt;
  ctx.save();
  if (G.shake > 0.2) ctx.translate(rand(-G.shake, G.shake) * 0.5, rand(-G.shake, G.shake) * 0.5);
  if (G.scene === 'title') drawTitle();
  else if (G.scene === 'play') drawPlay(dt);
  else drawOver();
  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
